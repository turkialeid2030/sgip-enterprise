# SGIP Sovereign GRC OS — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
version: "3.9"

services:
  # ── Sovereign GRC API ────────────────────────────────────────
  sgip-api:
    build:
      context: ../..            # resolved from infra/docker
      dockerfile: Dockerfile
      target: production
    image: sgip/sovereign-grc-os:latest
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://sgip_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD required}@postgres:5432/sgip_prod"  # runtime role, NOT the owner account
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET required}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OTEL_SERVICE_NAME: "sgip-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_TRACES_EXPORTER: "otlp"
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - sgip-internal
      - sgip-external
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sgip-api.rule=Host(`api.sgip.internal`)"
      - "traefik.http.routers.sgip-api.tls=true"

  # ── PostgreSQL HA Primary ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sgip_prod
      POSTGRES_USER: sgip
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?APP_DB_PASSWORD required by 05-create-roles.sh}"
      MIGRATOR_DB_PASSWORD: "${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD required}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/05-create-roles.sh:/docker-entrypoint-initdb.d/05_roles.sh:ro
      - ../../db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../../infra/postgres/10-apply-migrations.sh:/docker-entrypoint-initdb.d/10_migrate.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgip -d sgip_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sgip-internal
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      -c shared_preload_libraries=pg_stat_statements
      -c log_statement=all
      -c log_connections=on
      -c log_disconnections=on

  # ── Kafka Event Bus ───────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      CLUSTER_ID: "sgip-governance-cluster"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - sgip-internal

  # ── Redis (Session + Cache) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - sgip-internal

  # ── OpenTelemetry Collector ───────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ../../infra/observability/otel-config.yml:/etc/otel/config.yml
    command: ["--config=/etc/otel/config.yml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
    restart: unless-stopped
    networks:
      - sgip-internal

  # ── Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - sgip-internal

  # ── Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/observability/grafana-dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - sgip-internal

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  sgip-internal:
    internal: true
  sgip-external:
    driver: bridge
