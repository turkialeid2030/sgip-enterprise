# SGIP Sovereign GRC OS — Kubernetes Deployment
# Usage: kubectl apply -f infra/kubernetes/
# Requires: kubectl, Kubernetes 1.28+, cert-manager, Ingress controller

---
apiVersion: v1
kind: Namespace
metadata:
  name: sgip-production
  labels:
    name: sgip-production
    security.kubernetes.io/enforce: restricted

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgip-api
  namespace: sgip-production
  labels:
    app: sgip-api
    version: "8.0"
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: sgip-api
  template:
    metadata:
      labels:
        app: sgip-api
        version: "8.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sgip-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: sgip-api
          image: sgip/sovereign-grc-os:8.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: jwt-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: anthropic-api-key
            - name: OTEL_SERVICE_NAME
              value: sgip-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: sgip-api
  namespace: sgip-production
spec:
  selector:
    app: sgip-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  type: ClusterIP

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sgip-api-hpa
  namespace: sgip-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sgip-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# NetworkPolicy — Zero Trust
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sgip-api-netpol
  namespace: sgip-production
spec:
  podSelector:
    matchLabels:
      app: sgip-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 4000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sgip-api
  namespace: sgip-production
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/sgip-api-role"  # For AWS EKS IRSA

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sgip-api-pdb
  namespace: sgip-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sgip-api
