# SGIP V4 — Kubernetes deployment baseline
# The deployment workflow MUST replace qualification-placeholder with the immutable image tag/SHA.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sgip-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgip-api
  namespace: sgip-production
  labels:
    app: sgip-api
    version: "v4"
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: sgip-api
  template:
    metadata:
      labels:
        app: sgip-api
        version: "v4"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sgip-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sgip-api
          image: ghcr.io/turkialeid2030/sgip-enterprise:qualification-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: jwt-refresh-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: anthropic-api-key
                  optional: true
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: kafka-brokers
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: redis-url
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: sgip-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: sgip-secrets
                  key: otel-endpoint
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: sgip-api
  namespace: sgip-production
spec:
  selector:
    app: sgip-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sgip-api-hpa
  namespace: sgip-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sgip-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Port-constrained egress. Cloud security groups/firewalls must additionally
# restrict destination CIDRs for managed PostgreSQL/Kafka/Redis endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sgip-api-netpol
  namespace: sgip-production
spec:
  podSelector:
    matchLabels:
      app: sgip-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9094}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sgip-api
  namespace: sgip-production
automountServiceAccountToken: false

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sgip-api-pdb
  namespace: sgip-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sgip-api
