name: SGIP V4 Bootstrap

on:
  push:
    branches:
      - release/sgip-v4-qualification
    paths:
      - "bootstrap/**"
      - ".github/workflows/sgip-v4-bootstrap.yml"
  pull_request:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/sgip-v4-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          ref: release/sgip-v4-qualification
          fetch-depth: 0

      - name: Reconstruct verified V4 artifact
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/sgip-v4.part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/SGIP_GITHUB_READY_V4.zip
          echo "ce5b095743a96e47b58548aff144c1148d9e1320d4641f6236c066e7bbb3864d  /tmp/SGIP_GITHUB_READY_V4.zip" | sha256sum -c -

      - name: Expand source into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgip-v4-expanded
          mkdir -p /tmp/sgip-v4-expanded
          unzip -q /tmp/SGIP_GITHUB_READY_V4.zip -d /tmp/sgip-v4-expanded
          test -f /tmp/sgip-v4-expanded/sgip-enterprise/package.json
          rsync -a --delete --exclude='.git/' /tmp/sgip-v4-expanded/sgip-enterprise/ ./
          rm -rf bootstrap
          test -f package.json
          test -f .github/workflows/sgip-qualification.yml

      - name: Commit expanded V4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sgip-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No expansion changes to commit."
            exit 0
          fi
          git commit -m "chore: expand verified SGIP V4 source"
          git push origin HEAD:release/sgip-v4-qualification
