name: SGIP Dependency Remediation

on:
  push:
    branches:
      - release/sgip-v4-qualification
    paths:
      - ".github/workflows/dependency-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nonbreaking-audit-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sgip-v4-qualification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply only npm non-breaking audit remediations to lockfile
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --no-audit
          rc=$?
          set -e
          echo "npm audit fix exit=$rc (unresolved advisories are evaluated after commit)"
      - name: Commit remediated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sgip-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No non-breaking dependency remediation available."
          else
            git commit -m "security: apply non-breaking npm audit remediations"
            git push origin HEAD:release/sgip-v4-qualification
          fi
      - name: Report remaining high/critical advisories
        run: npm audit --audit-level=high
