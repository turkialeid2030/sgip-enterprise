name: SGIP UI Dependency Remediation

on:
  push:
    branches:
      - release/sgip-v4-production-hardening
    paths:
      - ".github/workflows/ui-dependency-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sgip-ui-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sgip-v4-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-shell/package-lock.json
      - name: Upgrade Vite security boundary
        working-directory: ui-shell
        run: npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund vite@8.3.3 @vitejs/plugin-react@latest
      - name: Apply remaining non-breaking fixes
        working-directory: ui-shell
        run: npm audit fix --package-lock-only --ignore-scripts --no-audit || true
      - name: Verify clean install
        working-directory: ui-shell
        run: npm ci --no-audit --no-fund
      - name: Typecheck UI
        working-directory: ui-shell
        run: npm run typecheck
      - name: Build UI
        working-directory: ui-shell
        run: npm run build
      - name: Require zero high or critical UI advisories
        working-directory: ui-shell
        run: npm audit --audit-level=high
      - name: Commit verified UI dependency upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sgip-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ui-shell/package.json ui-shell/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "security: upgrade Vite toolchain"
            git push origin HEAD:release/sgip-v4-production-hardening
          fi

