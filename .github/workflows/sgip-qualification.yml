name: SGIP Production Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_error_contract_e2e:
        description: "Run authoritative Error Contract E2E"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: sgip-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  POSTGRES_DB: sgip_enterprise
  POSTGRES_USER: sgip_bootstrap
  POSTGRES_PASSWORD: ci_bootstrap_only
  APP_DB_PASSWORD: ci_app_only_ChangeMe123
  MIGRATOR_DB_PASSWORD: ci_migrator_only_ChangeMe123
  JWT_SECRET: ci_jwt_secret_ChangeMe_0123456789
  JWT_REFRESH_SECRET: ci_refresh_secret_ChangeMe_0123456789
  NODE_ENV: test

jobs:
  build-test:
    name: Build, Typecheck, Guards, Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:error-contract:static
      - run: npm run verify:deployment
      - run: npx jest --runInBand --detectOpenHandles
      - run: npm audit --audit-level=high

  postgres-semantic:
    name: PostgreSQL Migrations, Roles, RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          APP_DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
          MIGRATOR_DB_PASSWORD: ${{ env.MIGRATOR_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgip_bootstrap -d sgip_enterprise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sgip_app:ci_app_only_ChangeMe123@localhost:5432/sgip_enterprise
      PGPASSWORD: ci_bootstrap_only
      PGHOST: localhost
      PGPORT: "5432"
      SGIP_ROOT: ${{ github.workspace }}
      SGIP_MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Initialize SGIP roles
        run: bash infra/postgres/05-create-roles.sh
      - name: Apply authoritative migrations
        run: bash infra/postgres/10-apply-migrations.sh
      - name: Create/verify app runtime role
        run: bash infra/postgres/20-create-app-role.sh
      - name: Semantic PostgreSQL qualification
        run: node tools/qualification/verify-postgres-target.cjs

  container-smoke:
    name: Production Container, Trivy, Readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [build-test, postgres-semantic]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          APP_DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
          MIGRATOR_DB_PASSWORD: ${{ env.MIGRATOR_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgip_bootstrap -d sgip_enterprise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sgip_app:ci_app_only_ChangeMe123@127.0.0.1:5432/sgip_enterprise
      PGPASSWORD: ci_bootstrap_only
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      SGIP_MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
    steps:
      - uses: actions/checkout@v4
      - name: Initialize isolated PostgreSQL target
        run: |
          bash infra/postgres/05-create-roles.sh
          bash infra/postgres/10-apply-migrations.sh
          bash infra/postgres/20-create-app-role.sh
      - name: Build production image
        run: docker build --pull --target production -t "sgip-ci:${GITHUB_SHA}" .
      - name: Verify immutable runtime contents
        run: |
          test "$(docker inspect -f '{{.Config.User}}' "sgip-ci:${GITHUB_SHA}")" = "sgip"
          docker run --rm --entrypoint sh "sgip-ci:${GITHUB_SHA}" -c 'test -f /app/db/migrations/006_rls_complete.sql'
      - name: Trivy image gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.75.0 image \
            --exit-code 1 --severity HIGH,CRITICAL --no-progress \
            "sgip-ci:${GITHUB_SHA}"
      - name: Start production container
        run: |
          docker run -d --name sgip-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            "sgip-ci:${GITHUB_SHA}"
      - name: Verify readiness attestation
        run: |
          set -euo pipefail
          body=""
          for i in $(seq 1 60); do
            if body=$(curl --fail --silent http://127.0.0.1:4000/health/ready 2>/dev/null); then
              break
            fi
            sleep 1
          done
          echo "$body"
          BODY="$body" node -e '
            const j=JSON.parse(process.env.BODY||"{}");
            if(j.ready!==true) throw new Error("readiness is not true");
            const a=j.attestation||{};
            for(const k of ["migrationsVerified","rlsVerified","roleVerified"]) {
              if(a[k]!==true) throw new Error("attestation failed: "+k);
            }
            if(a.role!=="sgip_app") throw new Error("unexpected runtime DB role: "+a.role);
          '
      - name: Container diagnostics
        if: always()
        run: |
          docker logs sgip-smoke 2>&1 || true
          docker rm -f sgip-smoke >/dev/null 2>&1 || true

  error-contract-e2e:
    name: Canonical Error Contract E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-test, postgres-semantic, container-smoke]
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.run_error_contract_e2e == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          APP_DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
          MIGRATOR_DB_PASSWORD: ${{ env.MIGRATOR_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgip_bootstrap -d sgip_enterprise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sgip_app:ci_app_only_ChangeMe123@localhost:5432/sgip_enterprise
      ADMIN_DATABASE_URL: postgresql://sgip_bootstrap:ci_bootstrap_only@localhost:5432/sgip_enterprise
      PGPASSWORD: ci_bootstrap_only
      PGHOST: localhost
      PGPORT: "5432"
      SGIP_ROOT: ${{ github.workspace }}
      SGIP_MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
      SGIP_EXPECTED_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Initialize isolated PostgreSQL target
        run: |
          bash infra/postgres/05-create-roles.sh
          bash infra/postgres/10-apply-migrations.sh
          bash infra/postgres/20-create-app-role.sh
          node tools/qualification/verify-postgres-target.cjs
      - name: Development error-contract matrix
        run: NODE_ENV=development node scripts/error-contract-e2e-runtime.cjs development
      - name: Production error-contract matrix
        run: NODE_ENV=production node scripts/error-contract-e2e-runtime.cjs production
      - name: Database-down fail-closed matrix
        run: node scripts/error-contract-e2e-runtime.cjs db-down
      - name: Aggregate exact closure result
        run: node scripts/aggregate-error-contract-results.cjs
      - name: Fail closed if machine-readable result is absent
        run: |
          test -f sgip_run_results.json || {
            echo "BLOCKED: sgip_run_results.json was not produced." >&2
            exit 1
          }
      - name: Exact machine-readable acceptance
        run: node tools/qualification/verify-error-contract-results.cjs sgip_run_results.json
      - name: Final Release Gate Attestation
        run: echo "SGIP_RELEASE_GATE=PASS"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgip-error-contract-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            sgip_run_results.json
            ERROR_CONTRACT_FINAL_EXECUTION_REPORT_SGIP.md
            qualification-evidence/**
